databases:
  - name: hdm-postgres
    plan: basic-256mb
    databaseName: hdm
    user: hdm

services:
  - type: web
    name: hdm-social
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hdm-postgres
          property: connectionString
      - key: RATELIMIT_STORAGE_URI
        value: memory://
      - key: COOKIE_SECURE
        value: "true"
      - key: FLASK_DEBUG
        value: "0"
    disk:
      name: hdm-uploads
      mountPath: /opt/render/project/src/static/uploads
      sizeGB: 5
